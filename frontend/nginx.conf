# Server block of the production frontend image (copied to /etc/nginx/conf.d/default.conf).
server {
    listen 3000;
    listen [::]:3000;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css text/javascript application/javascript application/json image/svg+xml;

    # Bundle file names contain a content hash, so a file never changes under its name.
    # A missing one is a real 404 rather than the app shell, which would hide a broken deploy.
    location /static/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Written when the container starts (docker-entrypoint.d), so it must never be cached.
    location = /config.js {
        add_header Cache-Control "no-store";
    }

    # The entry page names the current bundles, so the browser has to revalidate it.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Anything else gets the app shell, as the dev server does.
    location / {
        try_files $uri /index.html;
    }
}
