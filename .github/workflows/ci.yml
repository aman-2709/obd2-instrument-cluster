name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (.NET 8)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore ObdDashboard.csproj

      - name: Build
        run: dotnet build ObdDashboard.csproj --no-restore --configuration Release

      - name: Test
        # Runs any xUnit/NUnit/MSTest projects in the solution.
        # Until you add one (see notes), this reports "no tests" and stays green.
        run: dotnet test ObdDashboard.csproj --configuration Release --verbosity normal

  frontend:
    name: Frontend (React + TypeScript)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build (includes TypeScript type-check)
        run: npm run build

      - name: Test
        run: npm test -- --watchAll=false --passWithNoTests
        env:
          CI: true

  # Release and deploy publish this image, and nothing else in CI builds a Docker image.
  frontend-image:
    name: Frontend image (nginx)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lint the shell scripts
        run: shellcheck -x frontend/scripts/image-smoke.sh frontend/docker-entrypoint.d/40-cluster-config.sh

      - name: Build the production image
        run: docker build --tag obd-frontend:ci frontend

      - name: Smoke test the production image
        run: frontend/scripts/image-smoke.sh obd-frontend:ci

      - name: Build the dev image (docker-compose.yml builds target dev)
        run: docker build --target dev --tag obd-frontend:ci-dev frontend

  # docker-compose.prod.yml is what a Raspberry Pi runs, and nothing else in CI started it.
  production-compose:
    name: Production compose
    runs-on: ubuntu-latest
    env:
      # Local tags only: the images are built here and never pushed, and a neutral name keeps the
      # job independent of the repository's name (forks, upper case).
      OBD_VERSION: ci
      IMAGE_NAME: ci/obd2-instrument-cluster
    steps:
      - uses: actions/checkout@v4

      - name: Lint the shell scripts
        run: |
          shellcheck -x scripts/prod-compose-smoke.sh scripts/lib/smoke.sh
          shellcheck -S warning deploy-pi.sh

      - name: Validate the dev compose files
        run: docker compose -f docker-compose.yml -f docker-compose.override.yml config -q

      - name: Build the backend image
        run: docker build --tag "ghcr.io/$IMAGE_NAME-backend:$OBD_VERSION" backend

      - name: Build the frontend image
        run: docker build --tag "ghcr.io/$IMAGE_NAME-frontend:$OBD_VERSION" frontend

      - name: Smoke test docker-compose.prod.yml
        run: scripts/prod-compose-smoke.sh

