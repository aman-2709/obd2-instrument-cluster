
services:
  obd_backend:
    build: ./backend
    container_name: obd_backend
    environment:
      - OBD_PORT=/dev/ttyUSB0
      #Use /dev/serial0 or /dev/ttyAMA0 for Raspberry Pi.
    ports:
      - "8000:8000"
    privileged: true

  react_frontend:
    build:
      context: ./frontend
      # The dev server with hot reload. Without a target, Docker builds the last stage: the
      # production nginx image.
      target: dev
    container_name: react_frontend
    ports:
      - "3000:3000"
    depends_on:
      - obd_backend
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
    environment:
      - CHOKIDAR_USEPOLLING=true
      - WATCHPACK_POLLING=true
      # Cluster colour (blue or green). Unset or empty means the app's default theme.
      - REACT_APP_CLUSTER_THEME
    # privileged: true